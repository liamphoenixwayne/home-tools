<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡眠体感温度计算器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #f2efe8;
    --surface: #faf8f4;
    --border: #ddd8cc;
    --text: #252018;
    --muted: #9a9080;
    --ok: #2e6e3a;
    --ok-bg: #edf5ef;
    --ok-border: #aed4b8;
    --warn: #b85400;
    --warn-bg: #fdf1e6;
    --warn-border: #edb870;
    --edge: #7a5c00;
    --edge-bg: #fdf8e6;
    --edge-border: #e0cc80;
    --cool: #1a5c8a;
    --cool-bg: #e8f2fa;
    --cool-border: #90c0e0;
    --accent: #3d3228;
    --tag-bg: #ede9e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 24px;
  }

  .wrapper {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
  }

  .header { margin-bottom: 20px; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }

  h1 {
    font-size: 26px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.25;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--muted); font-weight: 300; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 1px 16px rgba(37,32,24,0.06);
  }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input-wrap { position: relative; }

  .input-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 38px 12px 14px;
    font-size: 24px;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .input-wrap input::-webkit-outer-spin-button,
  .input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61,50,40,0.08);
  }

  .unit {
    position: absolute;
    right: 13px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    pointer-events: none;
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #faf8f4;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.985); opacity: 0.82; }

  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  .result { display: none; animation: slideUp 0.22s ease; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-box {
    border-radius: 14px;
    padding: 18px 20px;
    border: 1.5px solid;
  }

  .result-box.ok   { background: var(--ok-bg);   border-color: var(--ok-border); }
  .result-box.warn { background: var(--warn-bg);  border-color: var(--warn-border); }
  .result-box.edge { background: var(--edge-bg);  border-color: var(--edge-border); }
  .result-box.cool { background: var(--cool-bg);  border-color: var(--cool-border); }

  .result-top {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 12px;
  }

  .result-num {
    font-family: 'DM Mono', monospace;
    font-size: 52px;
    font-weight: 300;
    line-height: 1;
  }

  .result-box.ok   .result-num { color: var(--ok); }
  .result-box.warn .result-num { color: var(--warn); }
  .result-box.edge .result-num { color: var(--edge); }
  .result-box.cool .result-num { color: var(--cool); }

  .result-unit-block { padding-bottom: 6px; }

  .result-unit {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    display: block;
    line-height: 1.3;
  }

  .verdict {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 5px;
  }

  .result-box.ok   .verdict { color: var(--ok); }
  .result-box.warn .verdict { color: var(--warn); }
  .result-box.edge .verdict { color: var(--edge); }
  .result-box.cool .verdict { color: var(--cool); }

  .desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.65;
  }

  .ac-mode {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    border: 1px solid;
  }

  .result-box.warn .ac-mode { background: #fff3e8; border-color: var(--warn-border); color: var(--warn); }
  .result-box.cool .ac-mode { background: #deedf8; border-color: var(--cool-border); color: var(--cool); }
  .result-box.edge .ac-mode { background: #fdf4d0; border-color: var(--edge-border); color: var(--edge); }

  .threshold-section { margin-top: 14px; }

  .threshold-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .threshold-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
  }

  .threshold-val {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
  }

  .bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    position: relative;
    overflow: visible;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
    max-width: 100%;
  }

  .bar-track.ok   .bar-fill { background: var(--ok); }
  .bar-track.warn .bar-fill { background: var(--warn); }
  .bar-track.edge .bar-fill { background: var(--edge); }
  .bar-track.cool .bar-fill { background: var(--cool); }

  .bar-marker {
    position: absolute;
    top: -3px;
    width: 2px; height: 10px;
    background: var(--accent);
    border-radius: 2px;
  }

  .version {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    opacity: 0.5;
    text-align: right;
    margin-top: 10px;
  }

  footer {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    opacity: 0.65;
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="tag"><span class="tag-dot"></span>睡眠环境</div>
    <h1>体感温度<br><span>开空调决策器</span></h1>
  </div>

  <div class="card">
    <div class="inputs">
      <div class="field">
        <label>室温</label>
        <div class="input-wrap">
          <input type="number" id="temp" placeholder="23" min="15" max="40" step="0.1">
          <span class="unit">°C</span>
        </div>
      </div>
      <div class="field">
        <label>湿度</label>
        <div class="input-wrap">
          <input type="number" id="humi" placeholder="60" min="10" max="100" step="1">
          <span class="unit">%</span>
        </div>
      </div>
    </div>

    <button class="btn" onclick="calculate()">计算体感 · 给出建议</button>

    <div class="result" id="result">
      <hr class="section-divider">

      <div class="result-box" id="result-box">
        <div class="result-top">
          <div class="result-num" id="hi-val">—</div>
          <div class="result-unit-block">
            <span class="result-unit">°C</span>
            <span class="result-unit">体感</span>
          </div>
        </div>
        <div class="verdict" id="verdict">—</div>
        <div class="desc" id="desc">—</div>
        <div class="ac-mode" id="ac-mode" style="display:none"></div>
      </div>

      <div class="threshold-section">
        <div class="threshold-row">
          <span class="threshold-label">葱头体感上限</span>
          <span class="threshold-val">24.5 °C</span>
        </div>
        <div class="bar-track" id="bar-track">
          <div class="bar-fill" id="bar-fill" style="width:0%"></div>
          <div class="bar-marker" id="bar-marker"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="version">v1.4 · Australian AT Formula</div>

  <footer>Designed by 葱头爸爸 · liamphoenixwayne@outlook.com</footer>

</div>

<script>
const LIMIT = 24.5;
const EDGE  = 0.1;

function australianAT(T, RH) {
  const e = (RH / 100) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
  return T + 0.33 * e - 4.00;
}

function acMode(T, RH) {
  const highTemp = T >= 26;
  const highHumi = RH >= 65;
  if (highTemp && highHumi) return { mode: '制冷模式（自带除湿）', icon: '❄️', type: 'cool' };
  if (highTemp && !highHumi) return { mode: '制冷模式', icon: '❄️', type: 'cool' };
  return { mode: '除湿模式', icon: '💧', type: 'warn' };
}

function calculate() {
  const T  = parseFloat(document.getElementById('temp').value);
  const RH = parseFloat(document.getElementById('humi').value);

  if (isNaN(T) || isNaN(RH) || T < 15 || T > 40 || RH < 10 || RH > 100) {
    alert('请输入合理的温度（15–40°C）和湿度（10–100%）');
    return;
  }

  const at      = australianAT(T, RH);
  const diff    = at - LIMIT;
  const absDiff = Math.abs(diff).toFixed(1);

  const resultEl  = document.getElementById('result');
  const boxEl     = document.getElementById('result-box');
  const hiEl      = document.getElementById('hi-val');
  const verdictEl = document.getElementById('verdict');
  const descEl    = document.getElementById('desc');
  const acModeEl  = document.getElementById('ac-mode');
  const barTrack  = document.getElementById('bar-track');
  const barFill   = document.getElementById('bar-fill');
  const barMarker = document.getElementById('bar-marker');

  hiEl.textContent = at.toFixed(1);
  resultEl.style.display = 'block';

  const minAt = 20, maxAt = 30;
  const pct       = Math.min(Math.max((at - minAt) / (maxAt - minAt) * 100, 2), 100);
  const markerPct = ((LIMIT - minAt) / (maxAt - minAt) * 100).toFixed(1);
  barFill.style.width  = pct.toFixed(1) + '%';
  barMarker.style.left = markerPct + '%';

  acModeEl.style.display = 'none';

  if (Math.abs(diff) <= EDGE) {
    boxEl.className    = 'result-box edge';
    barTrack.className = 'bar-track edge';
    verdictEl.textContent = '～ 葱头最高可适应睡眠体感温度';
    descEl.textContent = `体感处于个人上限附近（±${EDGE}°C），可酌情选择是否开空调，视当晚疲劳程度和个人感受决定。`;

  } else if (diff < 0) {
    boxEl.className    = 'result-box ok';
    barTrack.className = 'bar-track ok';
    verdictEl.textContent = '✓ 不用开空调';
    descEl.textContent = `体感低于葱头体感上限 ${absDiff}°C，蒸发散热顺畅，核心体温可正常下降，可以入睡。`;

  } else {
    const ac = acMode(T, RH);
    boxEl.className    = ac.type === 'cool' ? 'result-box cool' : 'result-box warn';
    barTrack.className = ac.type === 'cool' ? 'bar-track cool' : 'bar-track warn';
    verdictEl.textContent = '→ 建议开空调';
    descEl.textContent = `体感超出葱头体感上限 ${absDiff}°C，散热受阻，核心体温难以下降，建议睡前 1 小时开空调。`;
    acModeEl.style.display = 'inline-flex';
    acModeEl.textContent   = `${ac.icon} 推荐：${ac.mode}`;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});
</script>
</body>
</html>
