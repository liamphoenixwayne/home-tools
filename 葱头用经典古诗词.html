<style>
:root{
  --bg:#f5f2ec;

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden;}

#sb{width:272px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 12px rgba(0,0,0,.04);}
#sbh{padding:0;border-bottom:1px solid var(--line);}
#sbh-inner{background:#1c2b3a;padding:22px 20px 18px;}
#sbh h1{font-family:'EB Garamond',serif;font-size:11px;letter-spacing:4px;color:#5a7090;text-transform:uppercase;margin-bottom:6px;}
#sbh h2{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:#eef2f7;letter-spacing:2px;}
#sbh p{font-family:'Noto Sans SC',sans-serif;font-size:11px;color:#5a7090;margin-top:4px;}
#sx{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg);}
#sx input{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:4px;font-family:'Noto Sans SC',sans-serif;font-size:12px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s;}
#sx input:focus{border-color:var(--accent);}
#sx input::placeholder{color:var(--ink3);}
#toc{flex:1;overflow-y:auto;padding:4px 0 12px;}
#toc::-webkit-scrollbar{width:3px;}
#toc::-webkit-scrollbar-thumb{background:var(--line);}
.dg{}
.dy{font-family:'Noto Sans SC',sans-serif;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:3px;padding:12px 16px 4px;border-top:1px solid var(--line);margin-top:6px;}
.dg:first-child .dy{border-top:none;margin-top:0;}
.ti{padding:7px 16px;cursor:pointer;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink2);border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;transition:all .15s;line-height:1.5;}
.ti:hover{background:var(--bg);color:var(--ink);}
.ti.active{background:#eef3f9;color:var(--accent);border-left-color:var(--accent);font-weight:600;}
.ti .aa{font-size:11px;color:var(--ink3);flex-shrink:0;margin-left:6px;}
.ti.hidden{display:none;}
.dg.empty .dy{display:none;}

#main{flex:1;overflow-y:auto;padding:56px 68px;}
#main::-webkit-scrollbar{width:5px;}
#main::-webkit-scrollbar-thumb{background:var(--line);}
#wl{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;text-align:center;}
.wbc{font-family:'EB Garamond',serif;font-size:110px;color:var(--line);line-height:1;margin-bottom:24px;}
#wl h2{font-family:'Noto Serif SC',serif;font-size:18px;color:var(--ink2);margin-bottom:8px;}
#wl p{font-size:13px;color:var(--ink3);}

#art{display:none;max-width:680px;}
.ah{margin-bottom:40px;padding-bottom:22px;border-bottom:2px solid var(--ink);}
.at{font-family:'Noto Serif SC',serif;font-size:32px;font-weight:700;color:var(--accent);letter-spacing:3px;margin-bottom:8px;}
.am{font-family:'Noto Sans SC',sans-serif;font-size:12px;color:var(--ink3);letter-spacing:2px;}
.ab{font-family:'Noto Serif SC',serif;font-size:22px;line-height:2.5;color:var(--ink);}
.ab p{margin-bottom:.3em;}

#fc{position:fixed;bottom:28px;right:28px;display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.08);}
#fc span{font-size:11px;color:var(--ink3);}
#fc button{width:28px;height:28px;border:none;background:var(--bg2);border-radius:50%;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);transition:all .15s;}
#fc button:hover{background:var(--accent);color:#fff;}
footer{margin-top:72px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:11px;color:var(--ink3);}
</style>

<script>
const POEMS = [
{"d": "唐", "a": "李白", "t": "静夜思", "b": "床前明月光，疑是地上霜。\n举头望明月，低头思故乡。"},
{"d": "唐", "a": "李白", "t": "将进酒", "b": "君不见黄河之水天上来，奔流到海不复回。\n君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。\n钟鼓馔玉不足贵，但愿长醉不复醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。\n五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"},
{"d": "唐", "a": "李白", "t": "早发白帝城", "b": "朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。"},
{"d": "唐", "a": "李白", "t": "望庐山瀑布", "b": "日照香炉生紫烟，遥看瀑布挂前川。\n飞流直下三千尺，疑是银河落九天。"},
{"d": "唐", "a": "李白", "t": "黄鹤楼送孟浩然之广陵", "b": "故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。"},
{"d": "唐", "a": "李白", "t": "行路难·其一", "b": "金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。"},
{"d": "唐", "a": "李白", "t": "登金陵凤凰台", "b": "凤凰台上凤凰游，凤去台空江自流。\n吴宫花草埋幽径，晋代衣冠成古丘。\n三山半落青天外，二水中分白鹭洲。\n总为浮云能蔽日，长安不见使人愁。"},
{"d": "唐", "a": "李白", "t": "宣州谢朓楼饯别校书叔云", "b": "弃我去者，昨日之日不可留；\n乱我心者，今日之日多烦忧。\n长风万里送秋雁，对此可以酣高楼。\n蓬莱文章建安骨，中间小谢又清发。\n俱怀逸兴壮思飞，欲上青天揽明月。\n抽刀断水水更流，举杯消愁愁更愁。\n人生在世不称意，明朝散发弄扁舟。"},
{"d": "唐", "a": "杜甫", "t": "春望", "b": "国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。"},
{"d": "唐", "a": "杜甫", "t": "登高", "b": "风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。"},
{"d": "唐", "a": "杜甫", "t": "望岳", "b": "岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。"},
{"d": "唐", "a": "杜甫", "t": "茅屋为秋风所破歌", "b": "八月秋高风怒号，卷我屋上三重茅。\n茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n南村群童欺我老无力，忍能对面为盗贼，公然抱茅入竹去。\n唇焦口燥呼不得，归来倚杖自叹息。\n安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"},
{"d": "唐", "a": "杜甫", "t": "春夜喜雨", "b": "好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。"},
{"d": "唐", "a": "杜甫", "t": "绝句", "b": "两个黄鹂鸣翠柳，一行白鹭上青天。\n窗含西岭千秋雪，门泊东吴万里船。"},
{"d": "唐", "a": "杜甫", "t": "旅夜书怀", "b": "细草微风岸，危樯独夜舟。\n星垂平野阔，月涌大江流。\n名岂文章著，官应老病休。\n飘飘何所似，天地一沙鸥。"},
{"d": "唐", "a": "杜甫", "t": "登岳阳楼", "b": "昔闻洞庭水，今上岳阳楼。\n吴楚东南坼，乾坤日夜浮。\n亲朋无一字，老病有孤舟。\n戎马关山北，凭轩涕泗流。"},
{"d": "北宋", "a": "苏轼", "t": "水调歌头", "b": "明月几时有？把酒问青天。\n不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。\n不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。"},
{"d": "北宋", "a": "苏轼", "t": "念奴娇·赤壁怀古", "b": "大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。"},
{"d": "北宋", "a": "苏轼", "t": "定风波", "b": "莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。\n回首向来萧瑟处，归去，也无风雨也无晴。"},
{"d": "北宋", "a": "苏轼", "t": "江城子·乙卯正月二十日夜记梦", "b": "十年生死两茫茫，不思量，自难忘。\n千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。\n夜来幽梦忽还乡，小轩窗，正梳妆。\n相顾无言，惟有泪千行。\n料得年年肠断处，明月夜，短松冈。"},
{"d": "北宋", "a": "苏轼", "t": "题西林壁", "b": "横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。"},
{"d": "北宋", "a": "苏轼", "t": "饮湖上初晴后雨", "b": "水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。"},
{"d": "北宋", "a": "苏轼", "t": "惠崇春江晚景", "b": "竹外桃花三两枝，春江水暖鸭先知。\n蒌蒿满地芦芽短，正是河豚欲上时。"},
{"d": "北宋", "a": "苏轼", "t": "和子由渑池怀旧", "b": "人生到处知何似，应似飞鸿踏雪泥。\n泥上偶然留指爪，鸿飞那复计东西。\n老僧已死成新塔，坏壁无由见旧题。\n往日崎岖还记否，路长人困蹇驴嘶。"},
{"d": "南宋", "a": "辛弃疾", "t": "青玉案·元夕", "b": "东风夜放花千树，更吹落、星如雨。\n宝马雕车香满路。\n凤箫声动，玉壶光转，一夜鱼龙舞。\n蛾儿雪柳黄金缕，笑语盈盈暗香去。\n众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"},
{"d": "南宋", "a": "辛弃疾", "t": "破阵子·为陈同甫赋壮词以寄之", "b": "醉里挑灯看剑，梦回吹角连营。\n八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。\n了却君王天下事，赢得生前身后名。\n可怜白发生！"},
{"d": "南宋", "a": "辛弃疾", "t": "永遇乐·京口北固亭怀古", "b": "千古江山，英雄无觅孙仲谋处。\n舞榭歌台，风流总被雨打风吹去。\n斜阳草树，寻常巷陌，人道寄奴曾住。\n想当年，金戈铁马，气吞万里如虎。\n元嘉草草，封狼居胥，赢得仓皇北顾。\n四十三年，望中犹记，烽火扬州路。\n可堪回首，佛狸祠下，一片神鸦社鼓。\n凭谁问：廉颇老矣，尚能饭否？"},
{"d": "南宋", "a": "辛弃疾", "t": "菩萨蛮·书江西造口壁", "b": "郁孤台下清江水，中间多少行人泪。\n西北望长安，可怜无数山。\n青山遮不住，毕竟东流去。\n江晚正愁余，山深闻鹧鸪。"},
{"d": "南宋", "a": "辛弃疾", "t": "西江月·夜行黄沙道中", "b": "明月别枝惊鹊，清风半夜鸣蝉。\n稻花香里说丰年，听取蛙声一片。\n七八个星天外，两三点雨山前。\n旧时茅店社林边，路转溪桥忽见。"},
{"d": "南宋", "a": "辛弃疾", "t": "丑奴儿·书博山道中壁", "b": "少年不识愁滋味，爱上层楼。\n爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。\n欲说还休，却道天凉好个秋。"},
{"d": "南宋", "a": "李清照", "t": "声声慢", "b": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急？\n雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑？\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！"},
{"d": "南宋", "a": "李清照", "t": "一剪梅", "b": "红藕香残玉簟秋，轻解罗裳，独上兰舟。\n云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流，一种相思，两处闲愁。\n此情无计可消除，才下眉头，却上心头。"},
{"d": "南宋", "a": "李清照", "t": "如梦令", "b": "常记溪亭日暮，沉醉不知归路。\n兴尽晚回舟，误入藕花深处。\n争渡，争渡，惊起一滩鸥鹭。"},
{"d": "南宋", "a": "李清照", "t": "醉花阴", "b": "薄雾浓云愁永昼，瑞脑销金兽。\n佳节又重阳，玉枕纱厨，半夜凉初透。\n东篱把酒黄昏后，有暗香盈袖。\n莫道不销魂，帘卷西风，人比黄花瘦。"},
{"d": "南宋", "a": "李清照", "t": "武陵春", "b": "风住尘香花已尽，日晚倦梳头。\n物是人非事事休，欲语泪先流。\n闻说双溪春尚好，也拟泛轻舟。\n只恐双溪舴艋舟，载不动许多愁。"},
{"d": "南宋", "a": "李清照", "t": "夏日绝句", "b": "生当作人杰，死亦为鬼雄。\n至今思项羽，不肯过江东。"},
{"d": "五代", "a": "李煜", "t": "虞美人", "b": "春花秋月何时了，往事知多少。\n小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。\n问君能有几多愁，恰似一江春水向东流。"},
{"d": "五代", "a": "李煜", "t": "浪淘沙令", "b": "帘外雨潺潺，春意阑珊。\n罗衾不耐五更寒。\n梦里不知身是客，一晌贪欢。\n独自莫凭栏，无限江山，别时容易见时难。\n流水落花春去也，天上人间。"},
{"d": "五代", "a": "李煜", "t": "相见欢", "b": "无言独上西楼，月如钩。\n寂寞梧桐深院锁清秋。\n剪不断，理还乱，是离愁。\n别是一般滋味在心头。"},
{"d": "五代", "a": "李煜", "t": "清平乐", "b": "别来春半，触目柔肠断。\n砌下落梅如雪乱，拂了一身还满。\n雁来音信无凭，路遥归梦难成。\n离恨恰如春草，更行更远还生。"},
{"d": "五代", "a": "冯延巳", "t": "谒金门", "b": "风乍起，吹皱一池春水。\n闲引鸳鸯香径里，手挼红杏蕊。\n斗鸭阑干独倚，碧玉搔头斜坠。\n终日望君君不至，举头闻鹊喜。"},
{"d": "北宋", "a": "晏殊", "t": "浣溪沙", "b": "一曲新词酒一杯，去年天气旧亭台。\n夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。\n小园香径独徘徊。"},
{"d": "北宋", "a": "欧阳修", "t": "蝶恋花", "b": "庭院深深深几许？杨柳堆烟，帘幕无重数。\n玉勒雕鞍游冶处，楼高不见章台路。\n雨横风狂三月暮，门掩黄昏，无计留春住。\n泪眼问花花不语，乱红飞过秋千去。"},
{"d": "北宋", "a": "柳永", "t": "雨霖铃", "b": "寒蝉凄切，对长亭晚，骤雨初歇。\n都门帐饮无绪，留恋处，兰舟催发。\n执手相看泪眼，竟无语凝噎。\n念去去，千里烟波，暮霭沉沉楚天阔。\n多情自古伤离别，更那堪，冷落清秋节！\n今宵酒醒何处？杨柳岸，晓风残月。\n此去经年，应是良辰好景虚设。\n便纵有千种风情，更与何人说？"},
{"d": "唐", "a": "王维", "t": "鹿柴", "b": "空山不见人，但闻人语响。\n返景入深林，复照青苔上。"},
{"d": "唐", "a": "王维", "t": "送元二使安西", "b": "渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。"},
{"d": "唐", "a": "王维", "t": "九月九日忆山东兄弟", "b": "独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。"},
{"d": "唐", "a": "王维", "t": "相思", "b": "红豆生南国，春来发几枝。\n愿君多采撷，此物最相思。"},
{"d": "唐", "a": "王维", "t": "山居秋暝", "b": "空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。"},
{"d": "唐", "a": "王维", "t": "使至塞上", "b": "单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。"},
{"d": "唐", "a": "王维", "t": "终南别业", "b": "中岁颇好道，晚家南山陲。\n兴来每独往，胜事空自知。\n行到水穷处，坐看云起时。\n偶然值林叟，谈笑无还期。"},
{"d": "唐", "a": "孟浩然", "t": "春晓", "b": "春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。"},
{"d": "唐", "a": "孟浩然", "t": "宿建德江", "b": "移舟泊烟渚，日暮客愁新。\n野旷天低树，江清月近人。"},
{"d": "唐", "a": "孟浩然", "t": "过故人庄", "b": "故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。"},
{"d": "唐", "a": "白居易", "t": "赋得古原草送别", "b": "离离原上草，一岁一枯荣。\n野火烧不尽，春风吹又生。\n远芳侵古道，晴翠接荒城。\n又送王孙去，萋萋满别情。"},
{"d": "唐", "a": "白居易", "t": "钱塘湖春行", "b": "孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。"},
{"d": "唐", "a": "白居易", "t": "长恨歌", "b": "汉皇重色思倾国，御宇多年求不得。\n杨家有女初长成，养在深闺人未识。\n天生丽质难自弃，一朝选在君王侧。\n回眸一笑百媚生，六宫粉黛无颜色。\n春寒赐浴华清池，温泉水滑洗凝脂。\n侍儿扶起娇无力，始是新承恩泽时。\n云鬓花颜金步摇，芙蓉帐暖度春宵。\n春宵苦短日高起，从此君王不早朝。\n在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨绵绵无绝期。"},
{"d": "唐", "a": "白居易", "t": "琵琶行", "b": "浔阳江头夜送客，枫叶荻花秋瑟瑟。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n同是天涯沦落人，相逢何必曾相识。"},
{"d": "唐", "a": "韩愈", "t": "早春呈水部张十八员外", "b": "天街小雨润如酥，草色遥看近却无。\n最是一年春好处，绝胜烟柳满皇都。"},
{"d": "唐", "a": "张志和", "t": "渔歌子", "b": "西塞山前白鹭飞，桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，斜风细雨不须归。"},
{"d": "唐", "a": "张继", "t": "枫桥夜泊", "b": "月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船。"},
{"d": "唐", "a": "柳宗元", "t": "江雪", "b": "千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。"},
{"d": "唐", "a": "杜牧", "t": "泊秦淮", "b": "烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。"},
{"d": "唐", "a": "杜牧", "t": "山行", "b": "远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。"},
{"d": "唐", "a": "杜牧", "t": "清明", "b": "清明时节雨纷纷，路上行人欲断魂。\n借问酒家何处有？牧童遥指杏花村。"},
{"d": "唐", "a": "杜牧", "t": "赤壁", "b": "折戟沉沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。"},
{"d": "唐", "a": "李商隐", "t": "锦瑟", "b": "锦瑟无端五十弦，一弦一柱思华年。\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n沧海月明珠有泪，蓝田日暖玉生烟。\n此情可待成追忆，只是当时已惘然。"},
{"d": "唐", "a": "李商隐", "t": "夜雨寄北", "b": "君问归期未有期，巴山夜雨涨秋池。\n何当共剪西窗烛，却话巴山夜雨时。"},
{"d": "唐", "a": "李商隐", "t": "无题", "b": "相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。"},
{"d": "唐", "a": "李商隐", "t": "登乐游原", "b": "向晚意不适，驱车登古原。\n夕阳无限好，只是近黄昏。"},
{"d": "唐", "a": "温庭筠", "t": "梦江南", "b": "梳洗罢，独倚望江楼。\n过尽千帆皆不是，斜晖脉脉水悠悠。\n肠断白苹洲。"},
{"d": "唐", "a": "王昌龄", "t": "出塞", "b": "秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。"},
{"d": "唐", "a": "王昌龄", "t": "芙蓉楼送辛渐", "b": "寒雨连江夜入吴，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。"},
{"d": "唐", "a": "王之涣", "t": "凉州词", "b": "黄河远上白云间，一片孤城万仞山。\n羌笛何须怨杨柳，春风不度玉门关。"},
{"d": "唐", "a": "王翰", "t": "凉州词", "b": "葡萄美酒夜光杯，欲饮琵琶马上催。\n醉卧沙场君莫笑，古来征战几人回？"},
{"d": "唐", "a": "陈子昂", "t": "登幽州台歌", "b": "前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下。"},
{"d": "唐", "a": "崔颢", "t": "黄鹤楼", "b": "昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。"},
{"d": "唐", "a": "崔护", "t": "题都城南庄", "b": "去年今日此门中，人面桃花相映红。\n人面不知何处去，桃花依旧笑春风。"},
{"d": "唐", "a": "孟郊", "t": "游子吟", "b": "慈母手中线，游子身上衣。\n临行密密缝，意恐迟迟归。\n谁言寸草心，报得三春晖。"},
{"d": "唐", "a": "贺知章", "t": "回乡偶书", "b": "少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。"},
{"d": "唐", "a": "高适", "t": "别董大", "b": "千里黄云白日曛，北风吹雁雪纷纷。\n莫愁前路无知己，天下谁人不识君。"},
{"d": "东汉", "a": "曹操", "t": "观沧海", "b": "东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。"},
{"d": "东汉", "a": "曹操", "t": "龟虽寿", "b": "神龟虽寿，犹有竟时。\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里。\n烈士暮年，壮心不已。\n幸甚至哉，歌以咏志。"},
{"d": "东汉", "a": "曹操", "t": "短歌行", "b": "对酒当歌，人生几何！\n譬如朝露，去日苦多。\n慨当以慷，忧思难忘。\n何以解忧？唯有杜康。\n青青子衿，悠悠我心。\n但为君故，沉吟至今。\n山不厌高，海不厌深。\n周公吐哺，天下归心。"},
{"d": "东晋", "a": "陶渊明", "t": "饮酒·其五", "b": "结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。"},
{"d": "东晋", "a": "陶渊明", "t": "归园田居·其一", "b": "少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。\n狗吠深巷中，鸡鸣桑树颠。\n久在樊笼里，复得返自然。"},
{"d": "东晋", "a": "陶渊明", "t": "归园田居·其三", "b": "种豆南山下，草盛豆苗稀。\n晨兴理荒秽，带月荷锄归。\n道狭草木长，夕露沾我衣。\n衣沾不足惜，但使愿无违。"},
{"d": "先秦", "a": "佚名", "t": "蒹葭", "b": "蒹葭苍苍，白露为霜。所谓伊人，在水一方。\n溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。\n溯洄从之，道阻且跻。溯游从之，宛在水中坻。"},
{"d": "先秦", "a": "佚名", "t": "关雎", "b": "关关雎鸠，在河之洲。窈窕淑女，君子好逑。\n参差荇菜，左右流之。窈窕淑女，寤寐求之。\n求之不得，寤寐思服。悠哉悠哉，辗转反侧。\n参差荇菜，左右采之。窈窕淑女，琴瑟友之。\n参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"},
{"d": "先秦", "a": "屈原", "t": "离骚（节选）", "b": "帝高阳之苗裔兮，朕皇考曰伯庸。\n摄提贞于孟陬兮，惟庚寅吾以降。\n皇览揆余初度兮，肇锡余以嘉名：\n名余曰正则兮，字余曰灵均。\n长太息以掩涕兮，哀民生之多艰。\n路漫漫其修远兮，吾将上下而求索。"},
{"d": "先秦", "a": "屈原", "t": "橘颂", "b": "后皇嘉树，橘徕服兮。\n受命不迁，生南国兮。\n深固难徙，更壹志兮。\n绿叶素荣，纷其可喜兮。\n苏世独立，横而不流兮。\n闭心自慎，终不失过兮。\n秉德无私，参天地兮。"},
{"d": "南北朝", "a": "佚名", "t": "木兰辞", "b": "唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。\n昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。\n阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。\n将军百战死，壮士十年归。\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"},
{"d": "元", "a": "马致远", "t": "天净沙·秋思", "b": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马。\n夕阳西下，断肠人在天涯。"},
{"d": "元", "a": "张养浩", "t": "山坡羊·潼关怀古", "b": "峰峦如聚，波涛如怒，山河表里潼关路。\n望西都，意踌躇。\n伤心秦汉经行处，宫阙万间都做了土。\n兴，百姓苦；亡，百姓苦。"},
{"d": "元", "a": "白朴", "t": "天净沙·秋", "b": "孤村落日残霞，轻烟老树寒鸦，一点飞鸿影下。\n青山绿水，白草红叶黄花。"},
{"d": "元", "a": "关汉卿", "t": "大德歌·春", "b": "子规啼，不如归，道是春归人未归。\n几日添憔悴，虚飘飘柳絮飞。\n一春鱼雁无消息，则见双燕斗衔泥。"},
{"d": "明", "a": "于谦", "t": "石灰吟", "b": "千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。"},
{"d": "明", "a": "王守仁", "t": "游山西村", "b": "山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。"},
{"d": "清", "a": "郑燮", "t": "竹石", "b": "咬定青山不放松，立根原在破岩中。\n千磨万击还坚劲，任尔东西南北风。"},
{"d": "清", "a": "龚自珍", "t": "己亥杂诗·其五", "b": "浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。"},
{"d": "清", "a": "纳兰性德", "t": "长相思", "b": "山一程，水一程，身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，聒碎乡心梦不成，故园无此声。"},
{"d": "清", "a": "纳兰性德", "t": "木兰花令", "b": "人生若只如初见，何事秋风悲画扇。\n等闲变却故人心，却道故人心易变。\n骊山语罢清宵半，泪雨零铃终不怨。\n何如薄幸锦衣郎，比翼连枝当日愿。"},
{"d": "南宋", "a": "陆游", "t": "钗头凤·红酥手", "b": "红酥手，黄縢酒，满城春色宫墙柳。\n东风恶，欢情薄，一怀愁绪，几年离索。错、错、错。\n春如旧，人空瘦，泪痕红浥鲛绡透。\n桃花落，闲池阁，山盟虽在，锦书难托。莫、莫、莫。"},
{"d": "南宋", "a": "陆游", "t": "示儿", "b": "死去元知万事空，但悲不见九州同。\n王师北定中原日，家祭无忘告乃翁。"},
{"d": "南宋", "a": "陆游", "t": "十一月四日风雨大作", "b": "僵卧孤村不自哀，尚思为国戍轮台。\n夜阑卧听风吹雨，铁马冰河入梦来。"},
{"d": "南宋", "a": "陆游", "t": "游山西村", "b": "莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。"},
{"d": "南宋", "a": "范成大", "t": "四时田园杂兴·其一", "b": "昼出耘田夜绩麻，村庄儿女各当家。\n童孙未解供耕织，也傍桑阴学种瓜。"},
{"d": "南宋", "a": "杨万里", "t": "晓出净慈寺送林子方", "b": "毕竟西湖六月中，风光不与四时同。\n接天莲叶无穷碧，映日荷花别样红。"},
{"d": "南宋", "a": "文天祥", "t": "过零丁洋", "b": "辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死？留取丹心照汗青。"},
{"d": "南宋", "a": "秦观", "t": "鹊桥仙", "b": "纤云弄巧，飞星传恨，银汉迢迢暗度。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。"},
{"d": "北宋", "a": "王安石", "t": "泊船瓜洲", "b": "京口瓜洲一水间，钟山只隔数重山。\n春风又绿江南岸，明月何时照我还？"},
{"d": "北宋", "a": "王安石", "t": "梅花", "b": "墙角数枝梅，凌寒独自开。\n遥知不是雪，为有暗香来。"},
{"d": "北宋", "a": "范仲淹", "t": "渔家傲·秋思", "b": "塞下秋来风景异，衡阳雁去无留意。\n四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。\n羌管悠悠霜满地，人不寐，将军白发征夫泪。"},
{"d": "北宋", "a": "黄庭坚", "t": "清平乐·春归何处", "b": "春归何处？寂寞无行路。\n若有人知春去处，唤取归来同住。\n春无踪迹谁知？除非问取黄鹂。\n百啭无人能解，因风飞过蔷薇。"},
{"d": "北宋", "a": "晏几道", "t": "临江仙", "b": "梦后楼台高锁，酒醒帘幕低垂。\n去年春恨却来时。落花人独立，微雨燕双飞。\n记得小苹初见，两重心字罗衣。\n琵琶弦上说相思。当时明月在，曾照彩云归。"},
{"d": "北宋", "a": "周邦彦", "t": "苏幕遮", "b": "燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。\n叶上初阳干宿雨，水面清圆，一一风荷举。\n故乡遥，何日去？家住吴门，久作长安旅。\n五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。"},
{"d": "北宋", "a": "秦观", "t": "浣溪沙", "b": "漠漠轻寒上小楼，晓阴无赖似穷秋。\n淡烟流水画屏幽。\n自在飞花轻似梦，无边丝雨细如愁。\n宝帘闲挂小银钩。"},
{"d": "唐", "a": "刘禹锡", "t": "陋室铭", "b": "山不在高，有仙则名。水不在深，有龙则灵。\n斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。\n谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。\n无丝竹之乱耳，无案牍之劳形。\n南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"},
{"d": "唐", "a": "刘禹锡", "t": "竹枝词", "b": "杨柳青青江水平，闻郎江上唱歌声。\n东边日出西边雨，道是无晴却有晴。"},
{"d": "唐", "a": "刘禹锡", "t": "乌衣巷", "b": "朱雀桥边野草花，乌衣巷口夕阳斜。\n旧时王谢堂前燕，飞入寻常百姓家。"},
{"d": "唐", "a": "刘禹锡", "t": "秋词", "b": "自古逢秋悲寂寥，我言秋日胜春朝。\n晴空一鹤排云上，便引诗情到碧霄。"},
{"d": "唐", "a": "岑参", "t": "白雪歌送武判官归京", "b": "北风卷地白草折，胡天八月即飞雪。\n忽如一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不暖锦衾薄。\n将军角弓不得控，都护铁衣冷难着。\n瀚海阑干百丈冰，愁云惨淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。"},
{"d": "唐", "a": "岑参", "t": "逢入京使", "b": "故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。"},
{"d": "唐", "a": "李颀", "t": "古从军行", "b": "白日登山望烽火，黄昏饮马傍交河。\n行人刁斗风沙暗，公主琵琶幽怨多。\n野云万里无城郭，雨雪纷纷连大漠。\n胡雁哀鸣夜夜飞，胡儿眼泪双双落。\n闻道玉门犹被遮，应将性命逐轻车。\n年年战骨埋荒外，空见蒲桃入汉家。"},
{"d": "唐", "a": "李白", "t": "关山月", "b": "明月出天山，苍茫云海间。\n长风几万里，吹度玉门关。\n汉下白登道，胡窥青海湾。\n由来征战地，不见有人还。\n戍客望边邑，思归多苦颜。\n高楼当此夜，叹息未应闲。"},
{"d": "唐", "a": "李白", "t": "静夜思·其二", "b": "峨眉山月半轮秋，影入平羌江水流。\n夜发清溪向三峡，思君不见下渝州。"},
{"d": "唐", "a": "李白", "t": "独坐敬亭山", "b": "众鸟高飞尽，孤云独去闲。\n相看两不厌，只有敬亭山。"},
{"d": "唐", "a": "李白", "t": "客中行", "b": "兰陵美酒郁金香，玉碗盛来琥珀光。\n但使主人能醉客，不知何处是他乡。"},
{"d": "唐", "a": "杜甫", "t": "江畔独步寻花", "b": "黄四娘家花满蹊，千朵万朵压枝低。\n留连戏蝶时时舞，自在娇莺恰恰啼。"},
{"d": "唐", "a": "杜甫", "t": "赠花卿", "b": "锦城丝管日纷纷，半入江风半入云。\n此曲只应天上有，人间能得几回闻。"},
{"d": "唐", "a": "杜甫", "t": "八阵图", "b": "功盖三分国，名成八阵图。\n江流石不转，遗恨失吞吴。"},
{"d": "唐", "a": "韩愈", "t": "左迁至蓝关示侄孙湘", "b": "一封朝奏九重天，夕贬潮州路八千。\n欲为圣明除弊事，肯将衰朽惜残年！\n云横秦岭家何在？雪拥蓝关马不前。\n知汝远来应有意，好收吾骨瘴江边。"},
{"d": "南宋", "a": "姜夔", "t": "扬州慢", "b": "淮左名都，竹西佳处，解鞍少驻初程。\n过春风十里，尽荠麦青青。\n自胡马窥江去后，废池乔木，犹厌言兵。\n渐黄昏，清角吹寒，都在空城。\n杜郎俊赏，算而今重到须惊。\n纵豆蔻词工，青楼梦好，难赋深情。\n二十四桥仍在，波心荡，冷月无声。\n念桥边红药，年年知为谁生？"},
{"d": "南宋", "a": "吴文英", "t": "风入松", "b": "听风听雨过清明，愁草瘗花铭。\n楼前绿暗分携路，一丝柳、一寸柔情。\n料峭春寒中酒，交加晓梦啼莺。\n西园日日扫林亭，依旧赏新晴。\n黄蜂频扑秋千索，有当时纤手香凝。\n惆怅双鸳不到，幽阶一夜苔生。"},
{"d": "北宋", "a": "贺铸", "t": "青玉案", "b": "凌波不过横塘路，但目送、芳尘去。\n锦瑟华年谁与度？月台花榭，琐窗朱户，只有春知处。\n碧云冉冉蘅皋暮，彩笔新题断肠句。\n若问闲情都几许？一川烟草，满城风絮，梅子黄时雨。"},
{"d": "北宋", "a": "张先", "t": "天仙子", "b": "水调数声持酒听，午醉醒来愁未醒。\n送春春去几时回？临晚镜，伤流景，往事后期空记省。\n沙上并禽池上暝，云破月来花弄影。\n重重帘幕密遮灯，风不定，人初静，明日落红应满径。"},
{"d": "清", "a": "纳兰性德", "t": "虞美人", "b": "凭君料理花间课，莫负当初我。\n眼看鸡树欲西沉，鹦鹉声中不忍送君吟。\n希夷未梦沧桑界，光景余三载。\n一尊花底送将归，到得那时应悔此时迟。"},
{"d": "清", "a": "纳兰性德", "t": "浣溪沙", "b": "谁念西风独自凉，萧萧黄叶闭疏窗。\n沉思往事立残阳。\n被酒莫惊春睡重，赌书消得泼茶香。\n当时只道是寻常。"},
{"d": "唐", "a": "王勃", "t": "送杜少府之任蜀州", "b": "城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。"},
{"d": "唐", "a": "骆宾王", "t": "在狱咏蝉", "b": "西陆蝉声唱，南冠客思深。\n不堪玄鬓影，来对白头吟。\n露重飞难进，风多响易沉。\n无人信高洁，谁为表予心？"},
{"d": "唐", "a": "杜审言", "t": "和晋陵陆丞早春游望", "b": "独有宦游人，偏惊物候新。\n云霞出海曙，梅柳渡江春。\n淑气催黄鸟，晴光转绿苹。\n忽闻歌古调，归思欲沾巾。"},
{"d": "唐", "a": "宋之问", "t": "渡汉江", "b": "岭外音书断，经冬复历春。\n近乡情更怯，不敢问来人。"},
{"d": "唐", "a": "张九龄", "t": "望月怀远", "b": "海上生明月，天涯共此时。\n情人怨遥夜，竟夕起相思。\n灭烛怜光满，披衣觉露滋。\n不堪盈手赠，还寝梦佳期。"},
{"d": "唐", "a": "李白", "t": "月下独酌", "b": "花间一壶酒，独酌无相亲。\n举杯邀明月，对影成三人。\n月既不解饮，影徒随我身。\n暂伴月将影，行乐须及春。\n我歌月徘徊，我舞影零乱。\n醒时同交欢，醉后各分散。\n永结无情游，相期邈云汉。"},
{"d": "唐", "a": "李白", "t": "春夜洛城闻笛", "b": "谁家玉笛暗飞声，散入春风满洛城。\n此夜曲中闻折柳，何人不起故园情。"},
{"d": "唐", "a": "李白", "t": "山中问答", "b": "问余何意栖碧山，笑而不答心自闲。\n桃花流水窅然去，别有天地非人间。"},
{"d": "唐", "a": "杜甫", "t": "闻官军收河南河北", "b": "剑外忽传收蓟北，初闻涕泪满衣裳。\n却看妻子愁何在，漫卷诗书喜欲狂。\n白日放歌须纵酒，青春作伴好还乡。\n即从巴峡穿巫峡，便下襄阳向洛阳。"},
{"d": "唐", "a": "白居易", "t": "暮江吟", "b": "一道残阳铺水中，半江瑟瑟半江红。\n可怜九月初三夜，露似真珠月似弓。"},
{"d": "唐", "a": "白居易", "t": "问刘十九", "b": "绿蚁新醅酒，红泥小火炉。\n晚来天欲雪，能饮一杯无？"},
{"d": "唐", "a": "白居易", "t": "花非花", "b": "花非花，雾非雾，夜半来，天明去。\n来如春梦几多时？去似朝云无觅处。"},
{"d": "唐", "a": "许浑", "t": "咸阳城东楼", "b": "一上高城万里愁，蒹葭杨柳似汀洲。\n溪云初起日沉阁，山雨欲来风满楼。\n鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。\n行人莫问当年事，故国东来渭水流。"},
{"d": "唐", "a": "李群玉", "t": "黄陵庙", "b": "黄陵庙前莎草春，黄陵女儿蒨裙新。\n轻舟短棹唱歌去，水远山长愁杀人。"},
{"d": "唐", "a": "司空曙", "t": "喜外弟卢纶见宿", "b": "静夜四无邻，荒居旧业贫。\n雨中黄叶树，灯下白头人。\n以我独沉久，愧君相见频。\n平生自有分，况是蔡家亲。"},
{"d": "北宋", "a": "欧阳修", "t": "生查子·元夕", "b": "去年元夜时，花市灯如昼。\n月上柳梢头，人约黄昏后。\n今年元夜时，月与灯依旧。\n不见去年人，泪湿春衫袖。"},
{"d": "南宋", "a": "朱熹", "t": "观书有感", "b": "半亩方塘一鉴开，天光云影共徘徊。\n问渠那得清如许？为有源头活水来。"},
{"d": "南宋", "a": "叶绍翁", "t": "游园不值", "b": "应怜屐齿印苍苔，小扣柴扉久不开。\n春色满园关不住，一枝红杏出墙来。"},
{"d": "南宋", "a": "王十朋", "t": "梅花", "b": "一树寒梅白玉条，迥临村路傍溪桥。\n不知近水花先发，疑是经冬雪未销。"},
{"d": "明", "a": "唐寅", "t": "桃花庵歌", "b": "桃花坞里桃花庵，桃花庵里桃花仙。\n桃花仙人种桃树，又摘桃花换酒钱。\n酒醒只在花前坐，酒醉还来花下眠。\n半醒半醉日复日，花落花开年复年。\n但愿老死花酒间，不愿鞠躬车马前。"},
{"d": "清", "a": "黄景仁", "t": "绮怀", "b": "几回花下坐吹箫，银汉红墙入望遥。\n似此星辰非昨夜，为谁风露立中宵。\n缠绵思尽抽残茧，宛转心伤剥后蕉。\n三五年时三五月，可怜杯酒不曾消。"},
{"d": "唐", "a": "李白", "t": "赠汪伦", "b": "李白乘舟将欲行，忽闻岸上踏歌声。\n桃花潭水深千尺，不及汪伦送我情。"},
{"d": "唐", "a": "李白", "t": "望天门山", "b": "天门中断楚江开，碧水东流至此回。\n两岸青山相对出，孤帆一片日边来。"},
{"d": "唐", "a": "李白", "t": "渡荆门送别", "b": "渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。"},
{"d": "唐", "a": "杜甫", "t": "绝句二首·其二", "b": "江碧鸟逾白，山青花欲燃。\n今春看又过，何日是归年。"},
{"d": "唐", "a": "杜甫", "t": "登兖州城楼", "b": "东郡趋庭日，南楼纵目初。\n浮云连海岱，平野入青徐。\n孤嶂秦碑在，荒城鲁殿馀。\n从来多古意，临眺独踌躇。"},
{"d": "唐", "a": "白居易", "t": "大林寺桃花", "b": "人间四月芳菲尽，山寺桃花始盛开。\n长恨春归无觅处，不知转入此中来。"},
{"d": "唐", "a": "白居易", "t": "邯郸冬至夜思家", "b": "邯郸驿里逢冬至，抱膝灯前影伴身。\n想得家中夜深坐，还应说着远行人。"},
{"d": "唐", "a": "张祜", "t": "宫词", "b": "故国三千里，深宫二十年。\n一声何满子，双泪落君前。"},
{"d": "唐", "a": "王建", "t": "十五夜望月", "b": "中庭地白树栖鸦，冷露无声湿桂花。\n今夜月明人尽望，不知秋思落谁家。"},
{"d": "唐", "a": "刘长卿", "t": "逢雪宿芙蓉山主人", "b": "日暮苍山远，天寒白屋贫。\n柴门闻犬吠，风雪夜归人。"},
{"d": "唐", "a": "韦应物", "t": "滁州西涧", "b": "独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。"},
{"d": "唐", "a": "杜牧", "t": "题乌江亭", "b": "胜败兵家事不期，包羞忍耻是男儿。\n江东子弟多才俊，卷土重来未可知。"},
{"d": "唐", "a": "李商隐", "t": "嫦娥", "b": "云母屏风烛影深，长河渐落晓星沉。\n嫦娥应悔偷灵药，碧海青天夜夜心。"},
{"d": "唐", "a": "李商隐", "t": "贾生", "b": "宣室求贤访逐臣，贾生才调更无伦。\n可怜夜半虚前席，不问苍生问鬼神。"},
{"d": "唐", "a": "温庭筠", "t": "商山早行", "b": "晨起动征铎，客行悲故乡。\n鸡声茅店月，人迹板桥霜。\n槲叶落山路，枳花明驿墙。\n因思杜陵梦，凫雁满回塘。"},
{"d": "唐", "a": "戎昱", "t": "咏史", "b": "汉家青史上，计拙是和亲。\n社稷依明主，安危托妇人。\n岂能将玉貌，便拟静胡尘。\n地下千年骨，谁为辅佐臣。"},
{"d": "北宋", "a": "苏轼", "t": "花影", "b": "重重叠叠上瑶台，几度呼童扫不开。\n刚被太阳收拾去，却教明月送将来。"},
{"d": "北宋", "a": "王安石", "t": "元日", "b": "爆竹声中一岁除，春风送暖入屠苏。\n千门万户曈曈日，总把新桃换旧符。"},
{"d": "北宋", "a": "苏轼", "t": "赠刘景文", "b": "荷尽已无擎雨盖，菊残犹有傲霜枝。\n一年好景君须记，最是橙黄橘绿时。"},
{"d": "南宋", "a": "陆游", "t": "梅花绝句", "b": "闻道梅花坼晓风，雪堆遍满四山中。\n何方可化身千亿，一树梅前一放翁。"},
{"d": "南宋", "a": "叶绍翁", "t": "夜书所见", "b": "萧萧梧叶送寒声，江上秋风动客情。\n知有儿童挑促织，夜深篱落一灯明。"},
{"d": "明", "a": "高启", "t": "梅花九首·其一", "b": "琼姿只合在瑶台，谁向江南处处栽。\n雪满山中高士卧，月明林下美人来。\n寒依疏影萧萧竹，春掩残香漠漠苔。\n自去何郎无好咏，东风愁寂几回开。"},
{"d": "清", "a": "曹雪芹", "t": "葬花吟（节选）", "b": "花谢花飞花满天，红消香断有谁怜？\n游丝软系飘春榭，落絮轻沾扑绣帘。\n一年三百六十日，风刀霜剑严相逼。\n明媚鲜妍能几时，一朝漂泊难寻觅。\n花开易见落难寻，阶前愁杀葬花人。\n独倚花锄泪暗洒，洒上空枝见血痕。\n愿奴胁下生双翼，随花飞到天尽头。\n天尽头，何处有香丘？"},
{"d": "清", "a": "纳兰性德", "t": "采桑子", "b": "而今才道当时错，心绪凄迷。\n红泪偷垂，满眼春风百事非。\n情知此后来无计，强说欢期。\n一别如斯，落尽梨花月又西。"}
];
let fs=22;
function chg(d){fs=Math.max(14,Math.min(40,fs+d));document.getElementById('ab').style.fontSize=fs+'px';}
function show(i){
  const p=POEMS[i];
  document.getElementById('wl').style.display='none';
  document.getElementById('art').style.display='block';
  document.getElementById('at').textContent=p.t;
  document.getElementById('am').textContent=p.a+'　'+p.d;
  document.getElementById('ab').innerHTML=p.b.split('\n').map(l=>'<p>'+l+'</p>').join('');
  document.querySelectorAll('.ti').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.ti')[i].classList.add('active');
  document.getElementById('main').scrollTo(0,0);
}
function build(){
  const toc=document.getElementById('toc');
  let dy='',g=null;
  POEMS.forEach((p,i)=>{
    if(p.d!==dy){
      dy=p.d;
      g=document.createElement('div');g.className='dg';
      const lb=document.createElement('div');lb.className='dy';lb.textContent=p.d;
      g.appendChild(lb);toc.appendChild(g);
    }
    const el=document.createElement('div');el.className='ti';
    el.innerHTML='<span>'+p.t+'</span><span class="aa">'+p.a+'</span>';
    el.onclick=()=>show(i);
    g.appendChild(el);
  });
}
document.getElementById('si').addEventListener('input',function(){
  const q=this.value.trim();
  document.querySelectorAll('.ti').forEach(el=>{
    el.classList.toggle('hidden', q && !el.textContent.includes(q));
  });
  document.querySelectorAll('.dg').forEach(g=>{
    g.classList.toggle('empty', ![...g.querySelectorAll('.ti')].some(el=>!el.classList.contains('hidden')));
  });
});
build();
</script>
</body>
</html>
